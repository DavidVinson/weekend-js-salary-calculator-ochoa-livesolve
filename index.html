<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./client.js"></script>
    <title>SalaryCalculator</title>
  </head>
  <body>
    <h1>Salary Calculator</h1>
    <main>
      <form onsubmit="formHandler(event)">
        <!-- first name, last name, ID number, job title, annual salary. -->
        <input id="first-name-input" placeholder="First Name" />
        <input id="last-name-input" placeholder="Last Name" />
        <input id="id-input" placeholder="ID" />
        <input id="job-title-input" placeholder="Title" />
        <input id="annual-salary-input" placeholder="Annual Salary" />
        <button type="submit">Submit</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Id</th>
            <th>Title</th>
            <th>Annual Salary</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody id="employee-list">
          <!-- where employee will go -->
        </tbody>
      </table>

      <h2>Total Monthly Cost: <span id="total-monthly">0</span></h2>
    </main>
  </body>
</html>
